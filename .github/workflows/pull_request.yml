name: PR

on:
  pull_request:
    branches:
      - "main"
      - "v3-census"

concurrency:
  group: "${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: "read"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: |
          echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"
      - name: Write app version
        run: printf "${{ github.event.pull_request.head.sha }}" > .application-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.1.2
          virtualenvs-create: true
      - name: Install virtual environment
        run: poetry install
      - name: Compile translations
        run: make translate
      - name: Running translation tests
        run: poetry run python -m scripts.extract_translation_templates --test
      - name: Python linting
        run: make lint-python

  test-unit:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-tests-unit')"
    permissions:
      contents: "read"
    needs: [lint]
    runs-on: ubuntu-22.04
    env:
      CI: True
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: |
          echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.1.2
          virtualenvs-create: true
      - name: Install virtual environment
        run: poetry install
      - name: Install apt dependencies
        run: |
          sudo apt-get install libsnappy-dev libgconf-2-4 jq
          # Install wkthtmltopdf with patched Qt
          sudo apt-get install -y xfonts-base xfonts-75dpi
          wget https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6-1/wkhtmltox_0.12.6-1.bionic_amd64.deb
          sudo dpkg -i wkhtmltox_0.12.6-1.bionic_amd64.deb
      - name: Write app version
        run: printf "${{ github.event.pull_request.head.sha }}" > .application-version
      - name: Install dotenv plugin
        run: poetry self add poetry-plugin-dotenv@2.9.0
      - name: Load templates
        run: make load-design-system-templates
      - name: Compile translations
        run: make translate
      - name: Link env vars
        run: ln -sf .development.env .env
      - name: Running unit tests
        run: make test-unit
  validate-schemas:
    permissions:
      contents: "read"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: |
          echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"
      - name: Run validator
        run: ./scripts/run_validator.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.1.2
          virtualenvs-create: true
      - name: Running schema validation
        run: make validate-test-schemas

  test-functional:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-tests-acceptance')"
    permissions:
      contents: "read"
    needs: [lint]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Keep worker count low in CI because project matrix already parallelizes at job level
        include:
          - project: "components"
            max_instances: 1
          # but increase for timeout tests as most of the time is waiting
          - project: "timeout_modal"
            max_instances: 4
          - project: "features"
            max_instances: 1
          - project: "journeys"
            max_instances: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - run: |
          echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.1.2
          virtualenvs-create: true
      - name: Install virtual environment
        run: poetry install
      - name: Install npm deps
        run: npm ci
      - name: Install Playwright browser deps
        run: npx playwright install --with-deps chromium
      - name: Generate Playwright pages
        run: make generate-pages
      - name: Docker compose
        run: docker compose --version && RUNNER_ENV_FILE=.functional-tests.env docker compose up --build -d
      - name: Playwright functional tests
        run: npx playwright test --reporter list,html --workers ${{ matrix.max_instances }} --project=${{ matrix.project }}
      - name: Docker compose shutdown
        if: always()
        run: RUNNER_ENV_FILE=.functional-tests.env docker compose kill
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 10

