  #         CLEAN_TAG=$(echo "$PR_HEAD_REF" | tr / -)
  #         echo "TAG=$CLEAN_TAG" >> "$GITHUB_ENV"
  #         echo "SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"
