services:
  datastore:
    image: pricemonsdigital/gcloud-datastore-emulator:2.3.1
    environment:
      - CLOUDSDK_CORE_PROJECT=local
    networks:
      - eq-env

  redis:
    image: redis:8.2.2
    networks:
      - eq-env

  eq-questionnaire-runner:
    image: europe-west2-docker.pkg.dev/census-eq-ci/docker-images/census31-eq-questionnaire-runner:latest
    build: ./
    env_file:
      - ${RUNNER_ENV_FILE}
    environment:
      DATASTORE_EMULATOR_HOST: datastore:8432
      EQ_REDIS_HOST: "redis"
    restart: always
    depends_on:
      - datastore
      - redis
    networks:
      - eq-env
    ports:
      - "5000:5000"

  eq-questionnaire-launcher:
    image: europe-west2-docker.pkg.dev/ons-eq-ci/docker-images/eq-questionnaire-launcher:latest
    environment:
      SURVEY_RUNNER_URL: http://localhost:5000
      SURVEY_RUNNER_SCHEMA_URL: http://eq-questionnaire-runner:5000
    restart: always
    depends_on:
      - eq-questionnaire-runner
    networks:
      - eq-env
    ports:
      - "8000:8000"

networks:
  eq-env:
    driver: bridge
